name: Run analysis

on:
  push:
    branches: [main]
    paths-ignore: ["outputs/**", "data/**", "README.md"]
  workflow_dispatch:
  schedule:
    - cron: "0 4 2 * *"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py
      - name: Commit refreshed data, figures and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A outputs data README.md
          git diff --staged --quiet || git commit -m "Refresh data and results [skip ci]"
          git push
